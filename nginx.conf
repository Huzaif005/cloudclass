# ============================================================================
# CLOUDCLASS - NGINX PRODUCTION REVERSE PROXY CONFIGURATION (AWS EC2)
# ============================================================================
# Place in: /etc/nginx/sites-available/cloudclass
# Symlink: ln -s /etc/nginx/sites-available/cloudclass /etc/nginx/sites-enabled/
# ============================================================================

upstream cloudclass_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name _; # Replace with your custom domain or AWS EC2 Public DNS

    # Allow up to 30 MB file uploads for student assignment submissions
    client_max_body_size 30M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    # Static Assets Caching (CSS, JS, Fonts, Images)
    location ~* \.(css|js|woff2|woff|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        root /var/www/cloudclass;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # API & Dynamic Proxy Pass
    location / {
        proxy_pass http://cloudclass_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for heavy file uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health Check endpoint
    location /api/health {
        proxy_pass http://cloudclass_backend/api/health;
        access_log off;
    }
}
