<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudClass — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <div class="login-container">
    <div class="brand-section">
      <a class="brand-badge" href="index.html" title="CloudClass">
        <span class="brand-mark">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M9.4 23.5h14a5.2 5.2 0 0 0 .3-10.4A7.9 7.9 0 0 0 8.4 11a6.3 6.3 0 0 0 1 12.5Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <path d="m12.4 17.2 3.1 3.1 5.1-5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>cloud<span class="brand-light">class</span></span>
      </a>
      <p class="brand-tagline">Academic Workspace & Cloud Assignment Portal</p>
    </div>

    <div class="portal-card" id="portalCard">
      <!-- Role Tabs -->
      <div class="role-tabs">
        <button type="button" class="tab-btn active student" id="tabStudent" onclick="switchPortal('student')">
          <span>🎓</span> Student Portal
        </button>
        <button type="button" class="tab-btn" id="tabFaculty" onclick="switchPortal('faculty')">
          <span>👨‍🏫</span> Faculty Portal
        </button>
      </div>

      <!-- Student Login Form -->
      <form id="studentForm" class="auth-form" onsubmit="handleStudentSubmit(event)">
        <div class="form-group">
          <div class="label-row">
            <label for="studentId">6-Digit College ID</label>
            <span class="input-badge" id="studentIdCount">0 / 6 digits</span>
          </div>
          <div class="input-wrap">
            <span class="input-icon">🆔</span>
            <input 
              type="text" 
              id="studentId" 
              class="form-input" 
              placeholder="e.g. 102938" 
              maxlength="6" 
              pattern="[0-9]{6}" 
              inputmode="numeric" 
              autocomplete="off" 
              required 
            />
          </div>
          <p class="input-note">Enter your 6-digit institutional enrollment number.</p>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="studentPassword">Password / Security PIN</label>
          </div>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input 
              type="password" 
              id="studentPassword" 
              class="form-input" 
              placeholder="Enter your password" 
              minlength="4" 
              required 
            />
          </div>
        </div>

        <button type="submit" class="submit-btn student-theme" id="btnStudentLogin">
          <span>Enter Student Dashboard</span> ➔
        </button>
      </form>

      <!-- Faculty Login Form -->
      <form id="facultyForm" class="auth-form hidden faculty-mode" onsubmit="handleFacultySubmit(event)">
        <div class="form-group">
          <div class="label-row">
            <label for="facultyId">Assigned Faculty ID</label>
            <span class="input-badge">Admin Assigned</span>
          </div>
          <div class="input-wrap">
            <span class="input-icon">🏛️</span>
            <input 
              type="text" 
              id="facultyId" 
              class="form-input" 
              placeholder="e.g. FAC-101 or prof.sharma" 
              autocomplete="off" 
              required 
            />
          </div>
          <p class="input-note">Assigned by institutional administration / HOD office.</p>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="facultyPassword">Faculty Password</label>
          </div>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input 
              type="password" 
              id="facultyPassword" 
              class="form-input" 
              placeholder="Enter faculty password" 
              minlength="4" 
              required 
            />
          </div>
        </div>

        <button type="submit" class="submit-btn faculty-theme" id="btnFacultyLogin">
          <span>Enter Faculty Dashboard</span> ➔
        </button>
      </form>

      <!-- Status Alerts -->
      <div id="alertBox" class="alert-box alert-danger hidden"></div>

      <!-- Quick Test Fill Bar -->
      <div class="demo-quick-bar">
        <div class="demo-title">Quick Test Credentials</div>
        <div class="quick-buttons">
          <button type="button" class="quick-btn" onclick="quickFillStudent()">
            <strong>Student 102938</strong>
            <span>College ID: 102938</span>
          </button>
          <button type="button" class="quick-btn" onclick="quickFillFaculty()">
            <strong>Faculty FAC-101</strong>
            <span>ID: FAC-101</span>
          </button>
        </div>
      </div>

      <div class="card-footer-nav">
        <a href="index.html">← Continue as Guest in Demo Mode</a>
      </div>
    </div>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
